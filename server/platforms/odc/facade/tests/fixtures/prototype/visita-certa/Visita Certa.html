<style>
:root { --line: oklch(91% 0.01 240); --accent: oklch(55% 0.12 240); }
body { margin: 0; font-family: "Inter Tight", system-ui, sans-serif; font-size: 14px; }
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; z-index: 5; border-right: 1px solid var(--line); }
.nav-item { display: flex; gap: 10px; padding: 9px 10px; cursor: pointer; }
.nav-item.active { color: var(--accent); font-weight: 600; }
.main { padding: 32px 40px; }
.page { animation: pageIn .25s both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.seg { display: inline-flex; gap: 2px; }
.btn { display: inline-flex; gap: 8px; height: 30px; }
.chip { display: inline-flex; gap: 6px; border-radius: 999px; }
.tbl { width: 100%; border-collapse: separate; }
.modal-bg { position: fixed; inset: 0; z-index: 1000; background: oklch(15% 0.03 240 / .55); display: flex; align-items: center; justify-content: center; }
.modal { width: 100%; max-width: 560px; background: #fff; border-radius: 18px; }
.toast { position: fixed; bottom: 24px; left: 50%; }
</style>
</head>
