# Production deploy of the SSAM hosted server on one Linux VPS with Docker Compose. Owned by the SSAM-MCP monorepo: it
# does not come from the server line (the development compose is ../docker-compose.yml, with the ngrok tunnel).
# Runbook in pt-BR: DEPLOY.md, in this folder.
#
#   ssam-server  the image of ../Dockerfile. No host port: only on the internal network `backend`, which has no route out
#                (every operation on a customer's tenant or Studio goes through that customer's agent, which connects in).
#   caddy        the only service with host ports (80/443): automatic HTTPS for ${SSAM_DOMAIN} and the reverse proxy to
#                ssam-server:7310, without buffering (SSE on /mcp, NDJSON on /agent/v1/stream).
#   ssam-admin   profile admin: issue, list, revoke and rotate tokens (state volume only, no network).
#   ssam-ops     profile ops: backup.sh, restore.sh and file drops into the state volumes (no network, read-only).
#   ssam-console profile console: the owner console (licenses and monitoring, DEPLOY.md section 15). No network at all:
#                a unix socket in /var/lib/ssam-console/sock, forwarded from the host's 127.0.0.1:7320 by the systemd
#                units of host/install.sh and reached only through the owner's SSH tunnel. Enabled with
#                COMPOSE_PROFILES=console in .env, after host/install.sh.
#
# Every command runs from this folder, with the .env made from .env.prod.example:
#   sh build.sh                                                # the image (guard first), or pull it from the private registry
#   docker compose -f compose.prod.yml up -d
#   docker compose -f compose.prod.yml run --rm ssam-admin server-token issue --customer "Nome" --days 30 --lanes odc,o11

name: ssam-prod

x-hardening: &hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  ssam-server:
    <<: *hardening
    # SSAM_IMAGE_TAG may carry the digest (prod-...@sha256:<digest>, the digest of the image pushed to the registry): a tag pushed again
    # to the registry then cannot change the bits under the same name, and a rollback gets exactly the old image.
    image: ${SSAM_IMAGE:-ssam-server}:${SSAM_IMAGE_TAG:?set SSAM_IMAGE_TAG in .env (for example prod-20261010-acea75a)}
    # Built and proven for linux/amd64 only. No `build:` on purpose: the image comes only from deploy/build.sh, which runs
    # the client-name guard first (a `docker compose build` would skip it).
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SSAM_PORT: "7310"
      # The public host name: --public-host of `ssam serve` (Origin https://<domain> accepted from browsers).
      SSAM_PUBLIC_HOST: ${SSAM_DOMAIN:?set SSAM_DOMAIN in .env (the DNS name of this VPS, e.g. ssam.example.com)}
      SSAM_SERVER_RATE_PER_MINUTE: ${SSAM_RATE_PER_MINUTE:-240}
      # The build pool (one resident O11 and ODC worker per slot). Set it explicitly: inside a container the default
      # min(4, cores - 1) counts the host's cores, not the CPU limit below.
      SSAM_BUILD_WORKERS: ${SSAM_BUILD_WORKERS:-2}
    volumes:
      - server-state:/data/server
      - friction:/data/friction
      - odc-features:/data/odc-features
      # Module index and readers' copy (SSAM_MODULE_INDEX_ROOT, SSAM_READER_CACHE_ROOT of ../Dockerfile): kept across
      # container recreations (no cold start after an upgrade), outside the backup (the server rebuilds it).
      - cache:/data/cache
    expose:
      - "7310"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7310/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # SIGTERM closes the sessions and the agent channels before node exits.
    stop_grace_period: 30s
    # Not read_only: the server line keeps runtime caches inside its own tree (/app/.local, /app/platforms/odc/.local)
    # and writes the resident workers' locks and logs next to the compiled kernel CLIs (/app/kernel/.local). The image
    # lets uid 10001 write only there, in /tmp and in the volumes; the rest of /app and /studio is root's (../Dockerfile).
    read_only: false
    deploy:
      resources:
        limits:
          cpus: "${SSAM_CPUS:-2}"
          memory: ${SSAM_MEMORY:-6g}
          pids: ${SSAM_PIDS:-4096}

  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # Started, not healthy: Caddy gets the certificate while the server warms up (502 until it answers).
    depends_on:
      ssam-server:
        condition: service_started
    # SSAM_HTTP_PORT / SSAM_HTTPS_PORT may carry the address too (127.0.0.1:28443 for a local rehearsal).
    ports:
      - "${SSAM_HTTP_PORT:-80}:80"
      - "${SSAM_HTTPS_PORT:-443}:443"
    environment:
      SSAM_DOMAIN: ${SSAM_DOMAIN:?set SSAM_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (contact of the ACME account)}
      SSAM_ACME_CA: ${SSAM_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
          pids: 256

  # Token administration on demand: issue, list, revoke, agent-rotate. The plaintext token and agent credential are shown
  # once; the volume keeps only their SHA-256. tokens.json is re-read by the running server at the next request.
  ssam-admin:
    <<: *hardening
    image: ${SSAM_IMAGE:-ssam-server}:${SSAM_IMAGE_TAG:?set SSAM_IMAGE_TAG in .env}
    platform: linux/amd64
    profiles: [admin]
    # No log driver: `issue` and `agent-rotate` print the plaintext token and agent credential, and json-file would keep
    # them in /var/lib/docker/containers/<id>/*-json.log for as long as the container exists (forever without --rm).
    # The attached terminal of `docker compose run` still shows the output.
    logging:
      driver: none
    entrypoint: ["node", "facade/ssam.mjs"]
    command: ["server-token", "list"]
    network_mode: none
    volumes:
      - server-state:/data/server

  # Backup, restore, log rotation (rotate-logs.sh) and file drops (kernel.json, Features.plain.xml) into the state volumes,
  # and the cache clean-up, as uid 10001 like the server. backup.sh and restore.sh name the three state folders, never /data/cache.
  ssam-ops:
    <<: *hardening
    image: ${SSAM_IMAGE:-ssam-server}:${SSAM_IMAGE_TAG:?set SSAM_IMAGE_TAG in .env}
    platform: linux/amd64
    profiles: [ops]
    command: ["sh", "-c", "du -sh /data/server /data/friction /data/odc-features /data/cache"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - server-state:/data/server
      - friction:/data/friction
      - odc-features:/data/odc-features
      - cache:/data/cache

  # Owner console (DEPLOY.md section 15): licenses and monitoring, reachable only through the owner's SSH tunnel.
  # No network at all; a unix socket in /var/lib/ssam-console/sock, forwarded from 127.0.0.1:7320 by the host unit
  # ssam-console-proxy.socket. Same image as the server (node + the token store module); code bind-mounted from ./console.
  # It writes tokens.json only through the image's token module, appends /data/server/console-audit.jsonl and keeps its
  # own state in /state. The host folders must exist with their owners first (host/install.sh): create_host_path false
  # makes a missing one an error instead of a root-owned empty folder.
  ssam-console:
    <<: *hardening
    image: ${SSAM_IMAGE:-ssam-server}:${SSAM_IMAGE_TAG:?set SSAM_IMAGE_TAG in .env}
    platform: linux/amd64
    profiles: [console]
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["node", "/console/server.mjs"]
    command: []
    working_dir: /console
    environment:
      SSAM_SERVER_DIR: /data/server
      CONSOLE_SOCKET: /run/console/console.sock
      CONSOLE_STATE_DIR: /state
      CONSOLE_HOST_JSON: /host/host.json
      CONSOLE_PUBLIC_DIR: /console/public
      CONSOLE_TOKEN_MODULE: /app/platforms/odc/facade/server-tokens.mjs
      CONSOLE_DOMAIN: ${SSAM_DOMAIN:?set SSAM_DOMAIN in .env}
      TZ: UTC
    volumes:
      - server-state:/data/server
      - type: bind
        source: ./console
        target: /console
        read_only: true
      - type: bind
        source: ${SSAM_CONSOLE_DIR:-/var/lib/ssam-console}/host
        target: /host
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SSAM_CONSOLE_DIR:-/var/lib/ssam-console}/state
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${SSAM_CONSOLE_DIR:-/var/lib/ssam-console}/sock
        target: /run/console
        bind:
          create_host_path: false
    # The image declares VOLUME for these; small read-only tmpfs mounts stop Docker from creating anonymous volumes.
    tmpfs:
      - /tmp:size=16m
      - /data/friction:size=64k,mode=0555
      - /data/odc-features:size=64k,mode=0555
      - /data/cache:size=64k,mode=0555
    network_mode: none
    read_only: true
    # Overrides the image's HEALTHCHECK (the server's /health on 7310): /healthz over the unix socket.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({socketPath:'/run/console/console.sock',path:'/healthz',timeout:3000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
          pids: 64

volumes:
  server-state:
  friction:
  odc-features:
  cache:
  caddy-data:
  caddy-config:

networks:
  # Caddy's way in and out (published ports, ACME). IPv6 on: with an AAAA record, a client's IPv6 connection reaches Caddy
  # through ip6tables with its own address; on an IPv4-only network it would come through docker-proxy as the network's
  # gateway (172.x.0.1), and the audit trail (Caddy's log, session-opened, agent-connected, access-alerts) would show that
  # gateway instead of the client. Docker Engine 27+ gives the network a ULA subnet by itself. SSAM_EDGE_IPV6=false only
  # on a host without IPv6, and then publish no AAAA record.
  edge:
    enable_ipv6: ${SSAM_EDGE_IPV6:-true}
  # ssam-server <-> caddy only; internal: no route to the internet.
  backend:
    internal: true
