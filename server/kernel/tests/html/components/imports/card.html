    h2 { margin:0 0 20px; font-size:20px; }

    button { padding:10px 18px; border:0; border-radius:8px; background:#4758df; color:white; }
    footer { margin-top:20px; color:#68778c; font-size:14px; }
  </style>

    <h2>{{ title }}</h2><p class="count">{{ count }}</p>
