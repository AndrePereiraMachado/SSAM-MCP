# SSAM hosted MCP: the server (docker/ssam-server/Dockerfile) behind an ngrok tunnel, on a clean Linux server.
#
#   cp .env.example .env        # the ngrok domain and authtoken; the installer names only if they differ
#   (drop in docker/installers, per Studio, the official installer or a studio bundle; see its README)
#   docker compose build
#   docker compose up -d
#   docker compose run --rm ssam-admin server-token issue --customer "Nome" --days 30 --lanes "odc,o11"
#
# The Studios are read at build time (installers build context) from their official installers or, when absent, from
# studio bundles packed from installed Studios (docker/ssam-server/studio-bundle.ps1/.sh); only the files the kernels
# need stay in the image (/studio/o11, /studio/odc). Nothing of the host is mounted. Token hashes, customers'
# workspaces, audit, friction and the ODC feature cache live in volumes.

name: ssam

services:
  ssam-server:
    build:
      context: .
      dockerfile: docker/ssam-server/Dockerfile
      additional_contexts:
        installers: ${STUDIO_INSTALLERS_DIR:-./docker/installers}
      # Same defaults as the Dockerfile; an empty value means "none" (no URL, no pinned SHA256).
      args:
        SERVICE_STUDIO_INSTALLER: ${SERVICE_STUDIO_INSTALLER:-ServiceStudio-11.55.91.65258.exe}
        SERVICE_STUDIO_SHA256: ${SERVICE_STUDIO_SHA256:-10047d31a03adbbe6bd3a07c9de0506eeba3420e7031e51846607ee3fcde136c}
        SERVICE_STUDIO_URL: ${SERVICE_STUDIO_URL:-}
        ODC_STUDIO_INSTALLER: ${ODC_STUDIO_INSTALLER:-ODCStudio-1.7.27.10846.exe}
        ODC_STUDIO_SHA256: ${ODC_STUDIO_SHA256:-}
        ODC_STUDIO_URL: ${ODC_STUDIO_URL:-}
        # The other input, used when the installer is absent: a studio bundle packed from an installed Studio.
        SERVICE_STUDIO_BUNDLE: ${SERVICE_STUDIO_BUNDLE:-o11-studio-11.55.91.65258.tar.gz}
        SERVICE_STUDIO_BUNDLE_SHA256: ${SERVICE_STUDIO_BUNDLE_SHA256:-}
        ODC_STUDIO_BUNDLE: ${ODC_STUDIO_BUNDLE:-odc-studio-1.7.27.10846.tar.gz}
        ODC_STUDIO_BUNDLE_SHA256: ${ODC_STUDIO_BUNDLE_SHA256:-}
        STUDIO_EXTRACTOR: ${STUDIO_EXTRACTOR:-nsis}
    image: ssam-server:${SSAM_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    environment:
      SSAM_PORT: "7310"
      # The public host name the tunnel answers for (Origin check of browsers); the bind itself is --allow-remote.
      SSAM_PUBLIC_HOST: ${NGROK_DOMAIN:-}
    volumes:
      - server-state:/data/server
      - friction:/data/friction
      - odc-features:/data/odc-features
    # Only this host reaches the port directly (health, local admin); customers come through the tunnel.
    ports:
      - "127.0.0.1:${SSAM_HOST_PORT:-7310}:7310"
    networks: [ssam]

  tunnel:
    image: ngrok/ngrok:${NGROK_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      ssam-server:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env (never commit it)}
    command: ["http", "ssam-server:7310", "--url=https://${NGROK_DOMAIN:?set NGROK_DOMAIN to the reserved ngrok domain}"]
    # The ngrok inspection page stays on this host only.
    ports:
      - "127.0.0.1:${NGROK_INSPECT_PORT:-4040}:4040"
    networks: [ssam]

  # Administration on demand (same image, same state volume): tokens are issued, listed and revoked here; the plaintext
  # token is shown once and only its SHA-256 is kept in the volume.
  ssam-admin:
    image: ssam-server:${SSAM_IMAGE_TAG:-local}
    profiles: [admin]
    entrypoint: ["node", "facade/ssam.mjs"]
    command: ["server-token", "list"]
    volumes:
      - server-state:/data/server
    networks: [ssam]

volumes:
  server-state:
  friction:
  odc-features:

networks:
  ssam:
