name: Native agent installer (Mac)

on:
  workflow_dispatch:
    inputs:
      pack_release:
        description: Draft release holding the verified Mac bridge pack
        required: true
      pack_asset:
        description: Root-level runtime tar.gz asset (no source or credentials)
        required: true
      pack_sha256:
        description: Approved SHA-256 of the exact runtime archive
        required: true
      sign_and_notarize:
        description: Sign with Developer ID and notarize (false for an unsigned test installer)
        type: boolean
        default: false
      app_version:
        description: App version (x.y.z); the default is agent/package.json's
        type: string
        default: '0.2.8'
      enable_updates:
        description: The app updates itself from https://dist.ssam.pro/u/ssam-agent (requires sign_and_notarize)
        type: boolean
        default: false

  workflow_call:
    inputs:
      pack_release:
        required: true
        type: string
      pack_asset:
        required: true
        type: string
      pack_sha256:
        required: true
        type: string
      sign_and_notarize:
        type: boolean
        default: false
      app_version:
        type: string
        default: '0.2.8'
      enable_updates:
        type: boolean
        default: false

permissions:
  # GitHub requires write-level release access to read unpublished drafts.
  # This workflow downloads the input and never publishes a release or anything on dist.ssam.pro: the signed dmg, zip,
  # blockmap, latest-mac.yml and release-manifest.json are CI artifacts only; the owner (or the vigia) publishes them.
  contents: write

env:
  MSBUILDDISABLENODEREUSE: '1'
  PACK_RELEASE: ${{ inputs.pack_release }}
  PACK_ASSET: ${{ inputs.pack_asset }}
  PACK_SHA256: ${{ inputs.pack_sha256 }}
  APP_VERSION: ${{ inputs.app_version }}
  ENABLE_UPDATES: ${{ inputs.enable_updates && 'true' || 'false' }}

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Check the app version and the update mode
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = process.env.APP_VERSION, own = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error("app_version must be x.y.z: " + version);
            if (version !== own) console.log("::warning::app_version " + version + " overrides package.json " + own);
            if (process.env.ENABLE_UPDATES === "true" && process.env.SIGNED !== "true") throw Error("enable_updates needs sign_and_notarize: Squirrel.Mac installs only a Developer ID update");
            console.log(JSON.stringify({ appVersion: version, packageJson: own, enableUpdates: process.env.ENABLE_UPDATES === "true" }));'
        env:
          SIGNED: ${{ inputs.sign_and_notarize && 'true' || 'false' }}
      - name: Check release prerequisites
        if: inputs.sign_and_notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test "$(uname -m)" = arm64
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing signing configuration: $name"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download the approved bridge binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module -e 'if (!/^[A-Za-z0-9._-]+\.tar\.gz$/.test(process.env.PACK_ASSET) || !/^[a-fA-F0-9]{64}$/.test(process.env.PACK_SHA256)) process.exit(1)'
          mkdir -p "$RUNNER_TEMP/ssam-pack"
          gh release download "$PACK_RELEASE" --repo "$REPOSITORY" --pattern "$PACK_ASSET" --dir "$RUNNER_TEMP/ssam-pack"
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; const p=process.env.RUNNER_TEMP+"/ssam-pack/"+process.env.PACK_ASSET; if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==process.env.PACK_SHA256.toLowerCase()) throw Error("Runtime archive hash differs")'
      - name: Install and test the desktop app
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Check resources before filtered native tests
        run: &resources |
          # Release disposable filesystem cache, then enforce the same free-RAM floor.
          sudo purge
          node --input-type=module <<'JS'
          import os from 'node:os';
          import fs from 'node:fs';
          const disk = fs.statfsSync(process.cwd());
          const freeDisk = disk.bavail * disk.bsize;
          console.log(JSON.stringify({freeRam: os.freemem(), freeDisk}));
          if (os.freemem() < 3 * 1024 ** 3 || freeDisk < 8 * 1024 ** 3)
            throw new Error('At least 3 GiB free RAM and 8 GiB free disk are required.');
          JS
      - name: Test r40 native credentials and protocol
        run: >-
          dotnet test tests/native-protocol/NativeProtocol.Tests.csproj -c Release
          -p:UseSharedCompilation=false --filter 'FullyQualifiedName~Mac|FullyQualifiedName~Cognito|FullyQualifiedName~Credential|FullyQualifiedName~PrivatePromptCompletion|FullyQualifiedName~Users|FullyQualifiedName~Hello|FullyQualifiedName~OdcInventory|FullyQualifiedName~DocumentFetch'
          --logger 'trx;LogFileName=r40-mac.trx' --results-directory ci-results
      - name: Check resources before Native AOT publish
        run: *resources
      - name: Build native ARM64 executable from this checkout
        run: |
          test "$(uname -m)" = arm64
          dotnet publish native/Ssam.Agent/Ssam.Agent.csproj -c Release -r osx-arm64 --nologo -p:UseSharedCompilation=false
      - name: Qualify the Native AOT executable
        env:
          SSAM_NATIVE_EXE: ${{ github.workspace }}/agent/native/Ssam.Agent/bin/Release/net10.0/osx-arm64/publish/ssam-agent
        run: >-
          node --test tests/native/channel.test.mjs tests/native/workspace.test.mjs
          tests/native/studio-policy.test.mjs tests/native/app-integration.test.mjs
          tests/native/studio-build-plan.test.mjs tests/native/mac-bridge-build.test.mjs
      - name: Test r40 Node routing
        run: node --test agent/tests/mac-private-helper.test.mjs agent/tests/credential-concurrency.test.mjs agent/tests/credential-lifetime.test.mjs

      - name: Sign, package and notarize
        if: inputs.sign_and_notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export APPLE_TEAM_ID="$(node -e 'process.stdout.write(process.env.APPLE_TEAM_ID.trim())')"
          keychain="$RUNNER_TEMP/ssam-signing.keychain-db"
          certificate="$RUNNER_TEMP/ssam-signing.p12"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"' EXIT
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.env.RUNNER_TEMP+"/ssam-signing.p12", Buffer.from(process.env.CSC_LINK,"base64"), {mode:0o600})'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          node scripts/import-mac-identity.mjs "$keychain" "$certificate"
          export CSC_LINK="$certificate"
          curl --fail --silent --show-error https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n '/Developer ID Application/s/.*\([A-F0-9]\{40\}\).*/\1/p' | head -1)
          test -n "$identity" || { echo 'Developer ID Application identity missing'; exit 1; }
          native="native/Ssam.Agent/bin/Release/net10.0/osx-arm64/publish/ssam-agent"
          codesign --force --timestamp --options runtime --keychain "$keychain" --sign "$identity" "$native"
          codesign --verify --strict "$native"
          # enable_updates: resources/app-update.yml names https://dist.ssam.pro/u/ssam-agent and dist/latest-mac.yml lists the ZIP
          # (build.mjs checks both after electron-builder); otherwise --no-updates, the offline build of r43.
          updates=--no-updates; if [ "$ENABLE_UPDATES" = true ]; then updates=; fi
          node scripts/build.mjs --platform mac --pack "$RUNNER_TEMP/ssam-pack/$PACK_ASSET" --native "$native" --app-version "$APP_VERSION" $updates --notarize --bundled-bridges-only
          mkdir -p ci-results
          xcrun notarytool submit dist/*-mac-arm64.dmg --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --no-s3-acceleration --wait --output-format json > ci-results/notary-dmg.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("ci-results/notary-dmg.json","utf8")); if(r.status!=="Accepted") throw Error("DMG notarization was not accepted"); console.log("DMG notarization accepted: "+r.id);'
          xcrun stapler staple dist/*-mac-arm64.dmg
          xcrun stapler validate dist/*-mac-arm64.dmg
      - name: Package the unsigned installer
        if: ${{ !inputs.sign_and_notarize }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          test "$(uname -m)" = arm64
          node scripts/build.mjs --platform mac --pack "$RUNNER_TEMP/ssam-pack/$PACK_ASSET" --native native/Ssam.Agent/bin/Release/net10.0/osx-arm64/publish/ssam-agent --app-version "$APP_VERSION" --no-updates --test-unsigned
      - name: Verify the installed app
        run: |
          set -o pipefail
          node scripts/verify-native-distribution.mjs 'dist/mac-arm64/SSAM Agent.app' | tee dist/verify-native.json
          codesign --verify --deep --strict 'dist/mac-arm64/SSAM Agent.app'
          # The updater files exist exactly when the build updates itself (build.mjs checkMacOutput checked their content).
          if [ "$ENABLE_UPDATES" = true ]; then
            test -f 'dist/mac-arm64/SSAM Agent.app/Contents/Resources/app-update.yml' && test -f dist/latest-mac.yml
            cat 'dist/mac-arm64/SSAM Agent.app/Contents/Resources/app-update.yml' dist/latest-mac.yml
          else
            test ! -e 'dist/mac-arm64/SSAM Agent.app/Contents/Resources/app-update.yml' && test ! -e dist/latest-mac.yml
          fi
          shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS
      - name: Record the hello and the pack of the installed app
        run: |
          # The native core of the packaged app, run from its own resources/pack against the fake hub of the tests
          # (no network, a throwaway credential that is never stored): its hello and the installed pack's listing.
          node --input-type=module - <<'EOF'
          import fs from 'node:fs'; import path from 'node:path'; import os from 'node:os'; import cp from 'node:child_process'; import { randomBytes, createHash } from 'node:crypto';
          import { fakeHub } from './agent/tests/fixtures/fake-hub.mjs';
          import { packProblems } from './scripts/pack-pins.mjs';
          fs.mkdirSync('ci-results', { recursive: true });
          const pack = path.resolve('dist/mac-arm64/SSAM Agent.app/Contents/Resources/pack');
          const problems = packProblems(pack);
          const manifest = JSON.parse(fs.readFileSync(path.join(pack, 'pack.json'), 'utf8'));
          fs.writeFileSync('dist/installed-pack.json', JSON.stringify({ problems, pack: manifest }, null, 2) + '\n');
          if (problems.length) throw new Error('installed pack: ' + problems.join('; '));
          const credential = 'ssam_agent_' + randomBytes(32).toString('base64url');
          const hub = await fakeHub({ credential });
          const data = fs.mkdtempSync(path.join(os.homedir(), '.ssam-hello-'));
          fs.mkdirSync(path.join(data, 'private'), { recursive: true });
          fs.writeFileSync(path.join(data, 'private/config.json'), JSON.stringify({ server: hub.url, o11Port: 4599 }));
          const child = cp.spawn(path.join(pack, manifest.nativeCore.path), ['run', '--root', data, '--runtime-root', pack, '--credential-stdin'], { stdio: ['pipe', 'ignore', 'pipe'] });
          let stderr = ''; child.stderr.on('data', c => { stderr += c; }); child.stdin.end(credential + '\n');
          try {
            await hub.until(() => hub.hellos.length > 0, 30000);
            const hello = hub.hellos[0];
            fs.writeFileSync('ci-results/hello-028.json', JSON.stringify(hello, null, 2) + '\n');
            const summary = { version: hello.agent.version, runtime: hello.agent.runtime, platform: hello.agent.platform, kinds: hello.agent.kinds,
              pack: hello.pack, credentialStored: fs.existsSync(path.join(data, 'private/credential')),
              native: createHash('sha256').update(fs.readFileSync(path.join(pack, manifest.nativeCore.path))).digest('hex') };
            console.log(JSON.stringify(summary, null, 2));
            if (hello.agent.version !== '0.4.14-native' || hello.agent.runtime !== 'native-aot' || hello.agent.platform !== 'darwin') throw new Error('unexpected agent');
            if (JSON.stringify(hello.pack.odcBridges) !== '["v108","v109"]' || hello.pack.odcBridge !== 'v108') throw new Error('unexpected ODC bridges');
            // Mac app 0.2.8: the O11 thin bridges of the published Windows 0.2.8, the newest (11.55.94) as the default (no Studio
            // on the runner, so the hello reports the default); each build pinned by the installed pack's integrity list. Review
            // M2 of agent/mac-028: no 11.55.95 thin until it is proven; a Mac on 11.55.95 gets 11.55.94 with a warning.
            if (JSON.stringify(hello.pack.o11Builds) !== '["11.55.94","11.55.93","11.55.92"]' || hello.pack.o11BuiltFor !== '11.55.94') throw new Error('unexpected O11 builds');
            if (JSON.stringify((manifest.o11Builds ?? []).map(b => [b.version, b.runtime])) !== '[["11.55.94","net10.0"],["11.55.93","net8.0"],["11.55.92","net8.0"]]') throw new Error('unexpected O11 build runtimes');
            if (manifest.bridgeOffer !== false) throw new Error('Remote bridge offers must remain disabled');
            if (!hello.agent.kinds.includes('credential.session') || !hello.agent.kinds.includes('document.fetch')) throw new Error('Required r40 kinds missing');
            if (summary.credentialStored) throw new Error('the throwaway credential was stored');
          } catch (error) { throw error; }
          finally { fs.writeFileSync(path.join(data, 'private/agent.stop'), 'stop'); await hub.close(); await new Promise(r => { child.on('exit', r); setTimeout(() => { child.kill(); r(); }, 5000).unref(); }); fs.rmSync(data, { recursive: true, force: true }); }
          EOF
      - name: Write the release manifest
        run: |
          # What the vigia (or the owner) checks before publishing on dist.ssam.pro: every artifact with its size, sha512
          # (base64, as latest-mac.yml states it) and sha256, the commit, the notarization and the hello of the installed app.
          node --input-type=module - <<'EOF'
          import fs from 'node:fs'; import path from 'node:path'; import { createHash } from 'node:crypto';
          const dist = 'dist', read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : null;
          const names = fs.readdirSync(dist).filter(n => /-mac-arm64\.(dmg|zip)(\.blockmap)?$|^latest-mac\.yml$/.test(n)).sort();
          const artifacts = names.map(name => { const bytes = fs.readFileSync(path.join(dist, name));
            return { name, size: bytes.length, sha512: createHash('sha512').update(bytes).digest('base64'), sha256: createHash('sha256').update(bytes).digest('hex'),
              kind: /\.zip$/.test(name) ? 'update' : /\.dmg$/.test(name) ? 'installer' : /\.blockmap$/.test(name) ? 'blockmap' : 'feed', arch: 'arm64', platform: 'macos' }; });
          const notary = read('ci-results/notary-dmg.json'); const hello = read('ci-results/hello-028.json');
          const appUpdate = read('dist/mac-arm64/SSAM Agent.app/Contents/Resources/app-update.yml');
          const manifest = { schema: 'ssam-agent-mac-release/1', version: process.env.APP_VERSION, headSha: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID, signed: process.env.SIGNED === 'true', updates: process.env.ENABLE_UPDATES === 'true',
            feed: appUpdate ? (/^url:\s*(\S+)/m.exec(appUpdate)?.[1] ?? null) : null, pack: { asset: process.env.PACK_ASSET, sha256: process.env.PACK_SHA256.toLowerCase() },
            notarytool: notary ? { dmg: { id: JSON.parse(notary).id, status: JSON.parse(notary).status } } : null,
            hello: hello ? { agent: JSON.parse(hello).agent.version, pack: JSON.parse(hello).pack } : null, artifacts };
          if (manifest.updates && (!artifacts.some(a => a.name === 'latest-mac.yml') || manifest.feed !== 'https://dist.ssam.pro/u/ssam-agent')) throw new Error('an updating build without its feed files');
          if (!artifacts.some(a => a.kind === 'update') || !artifacts.some(a => a.kind === 'installer')) throw new Error('the dmg or the zip is missing');
          fs.writeFileSync('dist/release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify(manifest, null, 2));
          EOF
        env:
          SIGNED: ${{ inputs.sign_and_notarize && 'true' || 'false' }}
      - name: Exercise the Mac desktop interface and native agent
        run: |
          npm install --prefix "$RUNNER_TEMP/ssam-ui-test" --no-save --package-lock=false playwright@1.62.1
          # npm may defer dependency install scripts. electron-builder obtains
          # its own Electron; install the matching test binary explicitly too.
          node node_modules/electron/install.js
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ssam-ui-test/node_modules/playwright" node --test tests/native/electron-smoke.test.mjs
          SSAM_PACKAGED_APP="$PWD/dist/mac-arm64/SSAM Agent.app/Contents/MacOS/SSAM Agent" PLAYWRIGHT_MODULE="$RUNNER_TEMP/ssam-ui-test/node_modules/playwright" node --test tests/native/electron-smoke.test.mjs
      - name: Exercise all private dialog forms with synthetic data
        env:
          SSAM_TEST_OUTPUT: ${{ github.workspace }}/agent/ci-results
        run: |
          mkdir -p "$SSAM_TEST_OUTPUT"
          node tests/app/private-dialog-worker.integration.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r40-mac-arm64-test-evidence
          if-no-files-found: warn
          path: agent/ci-results/
      - name: Verify Developer ID and Gatekeeper
        if: inputs.sign_and_notarize
        run: |
          codesign --verify --deep --strict 'dist/mac-arm64/SSAM Agent.app'
          xcrun stapler validate 'dist/mac-arm64/SSAM Agent.app'
          spctl --assess --type execute --verbose=2 'dist/mac-arm64/SSAM Agent.app'
          mkdir -p "$RUNNER_TEMP/ssam-dmg-check"
          hdiutil attach dist/*-mac-arm64.dmg -mountpoint "$RUNNER_TEMP/ssam-dmg-check" -nobrowse -readonly
          trap 'hdiutil detach "$RUNNER_TEMP/ssam-dmg-check" >/dev/null' EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/ssam-dmg-check/SSAM Agent.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/ssam-dmg-check/SSAM Agent.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ssam-agent-mac-arm64-${{ inputs.sign_and_notarize && 'signed' || 'unsigned' }}
          if-no-files-found: error
          path: |
            agent/dist/*-mac-arm64.dmg
            agent/dist/*-mac-arm64.zip
            agent/dist/*-mac-arm64.zip.blockmap
            agent/dist/latest-mac.yml
            agent/dist/SHA256SUMS
            agent/dist/installed-pack.json
            agent/dist/verify-native.json
            agent/dist/release-manifest.json








