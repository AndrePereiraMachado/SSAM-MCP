# The legacy app entry delegates to the native pipeline required by r40.
# Manual only. Outputs are CI artifacts; no Release or update feed is published.
name: Agent app (macOS build)
on:
  workflow_dispatch:
    inputs:
      pack_release:
        description: Release holding the approved Mac runtime archive
        required: true
        type: string
      pack_asset:
        description: Exact runtime tar.gz asset
        required: true
        type: string
      pack_sha256:
        description: Approved SHA-256 of the runtime archive
        required: true
        type: string
      identity_only:
        type: boolean
        default: false
      sign_and_notarize:
        description: Sign and notarize the test artifacts
        type: boolean
        default: false
permissions:
  contents: write # Required only to read the existing private draft asset.
jobs:
  build:
    if: "${{ !inputs.identity_only }}"
    uses: ./.github/workflows/agent-native-release.yml
    with:
      pack_release: ${{ inputs.pack_release }}
      pack_asset: ${{ inputs.pack_asset }}
      pack_sha256: ${{ inputs.pack_sha256 }}
      sign_and_notarize: ${{ inputs.sign_and_notarize }}
    secrets: inherit

  check:
    if: "${{ inputs.identity_only }}"
    runs-on: macos-15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/checkout@v4
      - name: Validate encrypted identity without revealing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/import-check.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          node agent/scripts/import-mac-identity.mjs "$keychain" "$RUNNER_TEMP/import-check.p12"
          curl --fail --silent --show-error https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo 'Granting codesign access'
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          echo 'Checking signing identity'
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n '/Developer ID Application/s/.*\([A-F0-9]\{40\}\).*/\1/p' | head -1)
          test -n "$identity"
          cp /usr/bin/true "$RUNNER_TEMP/signing-probe"
          echo 'Signing isolated probe'
          codesign --force --timestamp --options runtime --keychain "$keychain" --sign "$identity" "$RUNNER_TEMP/signing-probe"
          codesign --verify --strict "$RUNNER_TEMP/signing-probe"
          team="$(node -e 'process.stdout.write(process.env.APPLE_TEAM_ID.trim())')"
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$team" --output-format json > "$RUNNER_TEMP/notary-history.json"
          node --input-type=module -e 'import fs from "node:fs";const h=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/notary-history.json","utf8"));console.log(JSON.stringify({history:h.history?.slice(0,5).map(({id,status,createdDate,name})=>({id,status,createdDate,name}))}));'
