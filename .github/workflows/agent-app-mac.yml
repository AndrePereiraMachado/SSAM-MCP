# The legacy app entry delegates to the native pipeline required by r40.
# Manual only. Outputs are CI artifacts; no Release or update feed is published.
name: Agent app (macOS build)
on:
  workflow_dispatch:
    inputs:
      pack_release:
        description: Release holding the approved Mac runtime archive
        required: true
        type: string
      pack_asset:
        description: Exact runtime tar.gz asset
        required: true
        type: string
      pack_sha256:
        description: Approved SHA-256 of the runtime archive
        required: true
        type: string
      sign_and_notarize:
        description: Sign and notarize the test artifacts
        type: boolean
        default: false
      app_version:
        description: App version (x.y.z); the default is agent/package.json's
        type: string
        default: '0.2.8'
      enable_updates:
        description: The app updates itself from https://dist.ssam.pro/u/ssam-agent (requires sign_and_notarize)
        type: boolean
        default: false
      update_feed:
        description: production = dist.ssam.pro/u/ssam-agent (every Mac); staging = dist.ssam.pro/u/ssam-agent-staging (the owner's test Mac only)
        type: choice
        options: [production, staging]
        default: production
permissions:
  contents: write # Required only to read the existing private draft asset.
jobs:
  build:
    uses: ./.github/workflows/agent-native-release.yml
    with:
      pack_release: ${{ inputs.pack_release }}
      pack_asset: ${{ inputs.pack_asset }}
      pack_sha256: ${{ inputs.pack_sha256 }}
      sign_and_notarize: ${{ inputs.sign_and_notarize }}
      app_version: ${{ inputs.app_version }}
      enable_updates: ${{ inputs.enable_updates }}
      update_feed: ${{ inputs.update_feed }}
    secrets: inherit
