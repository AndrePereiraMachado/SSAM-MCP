# The legacy app entry delegates to the native pipeline required by r40.
# Manual only. Outputs are CI artifacts; no Release or update feed is published.
name: Agent app (macOS build)
on:
  workflow_dispatch:
    inputs:
      pack_release:
        description: Release holding the approved Mac runtime archive
        required: true
        type: string
      pack_asset:
        description: Exact runtime tar.gz asset
        required: true
        type: string
      pack_sha256:
        description: Approved SHA-256 of the runtime archive
        required: true
        type: string
      identity_only:
        type: boolean
        default: false
      sign_and_notarize:
        description: Sign and notarize the test artifacts
        type: boolean
        default: false
permissions:
  contents: write # Required only to read the existing private draft asset.
jobs:
  build:
    if: "${{ !inputs.identity_only }}"
    uses: ./.github/workflows/agent-native-release.yml
    with:
      pack_release: ${{ inputs.pack_release }}
      pack_asset: ${{ inputs.pack_asset }}
      pack_sha256: ${{ inputs.pack_sha256 }}
      identity_only:
        type: boolean
        default: false
      sign_and_notarize: ${{ inputs.sign_and_notarize }}
    secrets: inherit

  check:
    if: "${{ inputs.identity_only }}"
    runs-on: macos-15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate encrypted identity without revealing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import cp from 'node:child_process';
          const file=process.env.RUNNER_TEMP+'/check.p12';
          const bytes=Buffer.from(process.env.CSC_LINK,'base64');
          fs.writeFileSync(file,bytes,{mode:0o600});
          try {
            console.log(JSON.stringify({certificateBytes:bytes.length,derSequence:bytes[0]===48}));
            const openssl='/opt/homebrew/opt/openssl@3/bin/openssl';
            for (const [mode,password] of [['exact',process.env.CSC_KEY_PASSWORD],['trimmed',process.env.CSC_KEY_PASSWORD.trim()]]) {
              const r=cp.spawnSync(openssl,['pkcs12','-in',file,'-passin','env:IDENTITY_PASSWORD','-noout'],{env:{...process.env,IDENTITY_PASSWORD:password},encoding:'utf8'});
              console.log(JSON.stringify({mode,valid:r.status===0}));
              if(r.status===0) {
                const pem=cp.spawnSync(openssl,['pkcs12','-in',file,'-passin','env:IDENTITY_PASSWORD','-nodes'],{env:{...process.env,IDENTITY_PASSWORD:password},encoding:'utf8'});
                console.log(JSON.stringify({hasCertificate:pem.stdout.includes('BEGIN CERTIFICATE'),hasPrivateKey:/BEGIN (?:ENCRYPTED |RSA )?PRIVATE KEY/.test(pem.stdout)}));
                process.exitCode=0; break;
              }
              process.exitCode=1;
            }
          } finally {fs.unlinkSync(file);}
          JS

