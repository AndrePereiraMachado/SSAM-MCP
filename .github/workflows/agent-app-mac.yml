# The legacy app entry delegates to the native pipeline required by r40.
# Manual only. Outputs are CI artifacts; no Release or update feed is published.
name: Agent app (macOS build)
on:
  workflow_dispatch:
    inputs:
      pack_release:
        description: Release holding the approved Mac runtime archive
        required: true
        type: string
      pack_asset:
        description: Exact runtime tar.gz asset
        required: true
        type: string
      pack_sha256:
        description: Approved SHA-256 of the runtime archive
        required: true
        type: string
      identity_only:
        type: boolean
        default: false
      sign_and_notarize:
        description: Sign and notarize the test artifacts
        type: boolean
        default: false
permissions:
  contents: write # Required only to read the existing private draft asset.
jobs:
  build:
    if: "${{ !inputs.identity_only }}"
    uses: ./.github/workflows/agent-native-release.yml
    with:
      pack_release: ${{ inputs.pack_release }}
      pack_asset: ${{ inputs.pack_asset }}
      pack_sha256: ${{ inputs.pack_sha256 }}
      sign_and_notarize: ${{ inputs.sign_and_notarize }}
    secrets: inherit

  check:
    if: "${{ inputs.identity_only }}"
    runs-on: macos-15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/checkout@v4
      - name: Validate encrypted identity without revealing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/import-check.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          node agent/scripts/import-mac-identity.mjs "$keychain" "$RUNNER_TEMP/import-check.p12"
